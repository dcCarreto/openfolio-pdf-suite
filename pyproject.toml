[project]
name = "openfolio-pdf-suite"
version = "2026.10.21"
description = "Suite completa e open source de manipulação de PDF, 100% local, sem paywall."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pypdf[crypto]>=5.0",
    # 6.12.0: derruba o processo ao sair no Linux e no macOS ("shared QObject was deleted
    # directly"); a 6.11.2 e a 6.10.3 não. Uma 6.12.x nova passa pelo CI antes de entrar no lock.
    "PySide6>=6.7,!=6.12.0",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "reportlab>=4.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pytesseract>=0.3.10",
    "pyhanko>=0.25",
    # As autoridades certificadoras do sistema, para a confiança nas assinaturas (core/signature.py).
    "oscrypto>=1.3",
]

[project.scripts]
openfolio = "core.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=6.0"]
build = ["pyinstaller>=6.0"]
# Versões fixas: uma versão nova do ruff ou do mypy pode reprovar o CI sem mudança no código.
lint = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools]
packages = ["core", "ui"]

[tool.setuptools.package-data]
core = ["data/fonts/*", "data/icc/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Regras de bugs comuns; o estilo (tamanho de linha, ordem de imports) fica livre.
select = ["E4", "E7", "E9", "F", "W", "B"]
# zip() sem strict=: vários usos pareiam de propósito listas de tamanhos diferentes.
ignore = ["B905"]

[tool.coverage.run]
source = ["core", "ui"]

[tool.coverage.report]
# Só os arquivos com linhas sem teste, dos menos cobertos para os mais cobertos.
show_missing = true
skip_covered = true
sort = "Cover"

[tool.mypy]
python_version = "3.10"
files = ["core", "ui", "main.py"]
# pytesseract, pyhanko e afins não publicam tipos.
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
