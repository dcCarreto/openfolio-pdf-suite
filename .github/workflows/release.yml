name: Release

# Builda o instalador de Windows, Linux (AppImage + .deb) e macOS (.dmg) e publica
# tudo numa GitHub Release, disparado por uma tag de versao (ex.: v0.2.0-beta.1).
#
# Cada plataforma builda na sua propria VM nativa (windows-latest/ubuntu-latest/
# macos-latest) porque PyInstaller empacota para o mesmo SO em que roda - nao ha
# cross-compilation aqui.
#
# O app nao depende de nenhum programa instalado: o Tesseract (OCR) vai dentro dele. Cada
# build instala o Tesseract pelo gerenciador de pacotes da VM, baixa os idiomas
# (packaging/fetch_tessdata.py) e o PyInstaller leva o binario com as bibliotecas dele. Um
# teste de fumaca roda o Tesseract de dentro do build antes de empacotar.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - id: extract
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          pip install -e ".[build]"
      - name: Tesseract (vai dentro do app)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          # O build do Tesseract para Windows vem com os simbolos de depuracao (a libtesseract
          # tem ~97 MB, ~4 MB sem eles); o LLVM ja vem instalado nas VMs do GitHub.
          $strip = "C:\Program Files\LLVM\bin\llvm-strip.exe"
          Get-ChildItem "C:\Program Files\Tesseract-OCR\*" -Include *.dll, tesseract.exe |
            ForEach-Object { & $strip --strip-debug $_.FullName; if ($LASTEXITCODE) { exit 1 } }
          python packaging/fetch_tessdata.py
      - name: Build PyInstaller
        run: pyinstaller packaging/pyinstaller/openfolio.spec --noconfirm
      - name: Testar o Tesseract embutido
        shell: pwsh
        run: |
          $internal = "dist\OpenFolioPDFSuite\_internal"
          $env:PATH = "C:\Windows\System32"  # sem o Tesseract instalado no caminho
          $env:TESSDATA_PREFIX = "$internal\tessdata"
          $langs = & "$internal\tesseract.exe" --list-langs
          if ($LASTEXITCODE -or -not ($langs -match "^por$")) { $langs; exit 1 }
      - name: Instalar Inno Setup
        run: choco install innosetup -y
      - name: Compilar instalador
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.version.outputs.version }} packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias do sistema (necessarias so pra importar o PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libgl1
          sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Instalar dependencias Python
        run: |
          pip install -e ".[build]"
          python packaging/fetch_tessdata.py
      - name: Build PyInstaller
        run: pyinstaller packaging/pyinstaller/openfolio.spec --noconfirm
      - name: Testar o Tesseract embutido
        run: |
          internal=dist/OpenFolioPDFSuite/_internal
          # Como o app empacotado roda: o bootloader do PyInstaller poe _internal no
          # LD_LIBRARY_PATH, e o processo do Tesseract herda.
          LD_LIBRARY_PATH="$internal" TESSDATA_PREFIX="$internal/tessdata" "$internal/tesseract" --list-langs | grep -x por
      - name: Build AppImage
        run: bash packaging/linux/build_appimage.sh "${{ needs.version.outputs.version }}"
      - name: Build .deb
        run: bash packaging/linux/build_deb.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/installer/*.AppImage
            dist/installer/*.deb

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          brew install tesseract
          pip install -e ".[build]"
          python packaging/fetch_tessdata.py
      - name: Build PyInstaller
        run: pyinstaller packaging/pyinstaller/openfolio.spec --noconfirm
      - name: Testar o Tesseract embutido
        run: |
          frameworks=dist/OpenFolioPDFSuite.app/Contents/Frameworks
          otool -L "$frameworks/tesseract"
          TESSDATA_PREFIX="$frameworks/tessdata" "$frameworks/tesseract" --list-langs | grep -x por
      - name: Build dmg
        run: bash packaging/macos/build_dmg.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/installer/*.dmg

  release:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenFolio PDF Suite ${{ needs.version.outputs.version }}"
          prerelease: ${{ contains(needs.version.outputs.version, 'beta') }}
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/linux-packages/*.AppImage
            artifacts/linux-packages/*.deb
            artifacts/macos-dmg/*.dmg
